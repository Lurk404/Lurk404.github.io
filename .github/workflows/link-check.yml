# Builds the site once a month, checks every link in it, and opens an issue
# listing any broken ones. To run it now: Actions tab > Check links > Run workflow.
name: Check links

on:
  schedule:
    - cron: "0 15 1 * *"   # 1st of every month, 15:00 UTC (8 am Pacific)
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  issues: write             # lets the workflow open an issue

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build the site the same way GitHub Pages does, into _site/, so the
      # check sees finished pages (real addresses, not {{ ... }} code)
      - name: Build the site
        uses: actions/jekyll-build-pages@v1

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # 403 and 429 count as OK: some sites block or rate-limit link
          # checkers even though the page works for people.
          # --root-dir lets links like /about-me/ be checked against the build.
          # Each --exclude skips a site that always looks broken to a checker
          # (LinkedIn answers every checker with an error). Add a line here
          # to skip another site.
          # The last two lines skip the theme and display-preferences files
          # and list the pages to check.
          args: >-
            --no-progress
            --accept '200..=299,403,429'
            --max-concurrency 8
            --timeout 30
            --max-retries 2
            --root-dir ${{ github.workspace }}/_site
            --exclude 'linkedin\.com'
            --exclude-path '_site/assets/'
            '_site/**/*.html'
          fail: false

      - name: Open an issue if any links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6.0.0
        with:
          title: Broken links report
          content-filepath: ./lychee/out.md
          labels: broken links
