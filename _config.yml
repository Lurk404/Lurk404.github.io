# Site settings for lurk404.github.io (Minimal Mistakes theme)
# Jekyll only reads this file when the site builds, so changes show up after
# the next build on GitHub (a minute or two).

title: Luke McKnight
description: >-
  Learning technology, accessible content, and open resources for
  post-secondary education, from Luke McKnight, digital accessibility
  specialist.
url: "https://lurk404.github.io"
baseurl: ""
locale: en-CA
timezone: America/Vancouver
github_username: Lurk404
search: true
breadcrumbs: true          # "Home / About me / Curriculum Vitae" above each page title
og_image: /assets/images/social-preview.png   # shown when a link is shared (Teams, social media)

# Theme: Minimal Mistakes, pinned to a release so updates don't change the site
# unexpectedly. _includes/masthead.html is a copy of this version's header.
remote_theme: mmistakes/minimal-mistakes@4.28.1
minimal_mistakes_skin: default   # colours come from _sass/portfolio/ instead

# Reflections keep the same addresses they had on WordPress
permalink: /:year/:month/:day/:title/

include: [_pages]
# Kept in the repository but not published. (Folders starting with _ that
# Jekyll doesn't know, like _maintenance, are skipped automatically.)
exclude: [README.md, Gemfile, Gemfile.lock]

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache   # Minimal Mistakes needs this
  - jekyll-redirect-from   # old addresses forward to new ones (redirect_from: in a page's front matter)

# Collections: groups of pages that share a folder and a list page.
# Each file in the folder becomes one page; its file name is its address.
#   _portfolio/  ->  /work/<file name>/      (listed on /work/ and, if
#                                             featured: true, on the home page)
#   _writing/    ->  /writing/<file name>/   (listed on /writing/)
# How to add one: _maintenance/work-and-writing.md
collections:
  portfolio:
    output: true
    permalink: /work/:path/
  writing:
    output: true
    permalink: /writing/:path/

# GitHub and LinkedIn icons: in the left sidebar and in the footer
author:
  name: "Luke McKnight"
  avatar: "/assets/images/logo.png"
  bio: "Digital accessibility specialist and assistive technologist."
  location: "Vancouver, BC"
  links: &social-links
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Lurk404"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/lukemcknight/"
footer:
  links: *social-links

# Front matter every page and reflection gets unless it sets its own.
# "toc" is the "On this page" box; it's hidden on pages with no headings.
defaults:
  - scope: { path: "_pages", type: pages }
    values: &page-defaults
      layout: single
      author_profile: true
      toc: true
      toc_sticky: true
  - scope: { path: "", type: posts }
    values:
      <<: *page-defaults
      read_time: true
      share: false
      related: true
  # Projects and books: laid out like the other pages
  - scope: { path: "", type: portfolio }
    values:
      <<: *page-defaults
  - scope: { path: "", type: writing }
    values:
      <<: *page-defaults

category_archive: { type: liquid, path: /categories/ }
tag_archive:      { type: liquid, path: /tags/ }
