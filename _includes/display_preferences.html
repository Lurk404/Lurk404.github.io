<!--
  Display preferences (Fluid Infusion UI Options): the "Show preferences" button
  in the header, and the script that starts the panel. The container and the
  panel itself (with Dark/Light and Reset at its top) are in masthead.html.
  Included from masthead.html. Styles and the Infusion script are loaded in
  head/custom.html; the layout is in _sass/portfolio/_custom.scss (search for
  "Display preferences"). The Infusion files are in assets/infusion/.
  Ported from the AT User Guides site (Lurk404/assistivetech).

  - Readers can change text size, font, line, letter and word spacing, colour
    contrast, make buttons and form fields bigger, and turn on text-to-speech.
    The choices apply to every page and are remembered in a browser cookie.
  - Text-to-speech uses the voices built into the reader's browser. When it's on,
    a play button appears at the top of the page and reads the page content
    (not the menus or footer).
  - The panels themselves are only downloaded the first time someone opens
    the panel ("lazyLoad").
  - "Reset" only resets the display preferences, not light/dark. Infusion hides
    it until the panel opens.
  - "Show preferences" is shown as soon as the page starts drawing, so it
    doesn't pop in late and shift the header. If Infusion then doesn't load, the
    script hides it again and moves the light/dark toggle into the header
    (without "Reset"), so dark mode still works.
  - The buttons stay hidden if JavaScript is off, since they can't work without it.
  - Button wording: screen readers hear "Show preferences" / "Hide preferences"
    (without the + and −), which matches the visible words, so voice control
    ("click Show preferences", "click Reset") works.
-->
<button type="button" class="page-nav-button flc-slidingPanel-toggleButton" hidden>+ Show preferences</button>

<script>
  (function () {
    /* Show the button now, while the header is being drawn (see the note above) */
    var toggle = document.querySelector('.masthead .flc-slidingPanel-toggleButton');
    if (toggle) toggle.hidden = false;

    function start() {
      var prefs = document.getElementById('site-prefs');
      if (!toggle || !prefs || !window.fluid || !fluid.uiOptions) {
        /* Infusion didn't load: hide "Show preferences", and move the light/dark
           toggle into the header without "Reset", which can't work without Infusion */
        if (toggle) toggle.hidden = true;
        var toolbar = document.getElementById('site-prefs-toolbar');
        var tools = document.querySelector('.masthead__tools');
        if (toolbar && tools) {
          var reset = toolbar.querySelector('.flc-prefsEditor-reset');
          if (reset) reset.remove();
          tools.appendChild(toolbar);
        }
        return;
      }

      /* Text-to-speech: read the page content, with the play button at the top.
         Pages without .page__content (like the home page list) get no play button. */
      var wrap = document.querySelector('.page__inner-wrap');
      var content = document.querySelector('.page__content');
      if (wrap && content) {
        wrap.classList.add('flc-prefs-selfVoicingWidget');
        content.classList.add('flc-orator-content');
      }

      /* Extra contrast theme: dark brown on sand (#F9F5E9), second in the list.
         Its colours are in _custom.scss (search for "fl-theme-sand"), and its name
         ("Dark brown on sand") is in assets/display-preferences/contrast.json. */
      fluid.defaults("fluid.prefs.schemas.contrast", {
        gradeNames: ["fluid.prefs.schemas"],
        schema: {
          "fluid.prefs.contrast": {
            "type": "string",
            "default": "default",
            "enum": ["default", "sand", "bw", "wb", "by", "yb", "lgdg", "gw", "gd", "bbr"],
            "enumLabels": ["contrast-default", "contrast-sand", "contrast-bw", "contrast-wb",
              "contrast-by", "contrast-yb", "contrast-lgdg", "contrast-gw", "contrast-gd", "contrast-bbr"]
          }
        }
      });

      fluid.uiOptions(prefs, {
        preferences: [
          "fluid.prefs.textSize",
          "fluid.prefs.textFont",
          "fluid.prefs.lineSpace",
          "fluid.prefs.letterSpace",
          "fluid.prefs.wordSpace",
          "fluid.prefs.contrast",
          "fluid.prefs.enhanceInputs",
          "fluid.prefs.speak"
        ],
        auxiliarySchema: {
          terms: {
            templatePrefix: "{{ '/assets/infusion/src/framework/preferences/html' | relative_url }}",
            messagePrefix: "{{ '/assets/infusion/src/framework/preferences/messages' | relative_url }}"
          },
          "fluid.prefs.contrast": {
            enactor: {
              classes: { "sand": "fl-theme-sand" }
            },
            panel: {
              classnameMap: { theme: { "sand": "fl-theme-sand" } },
              message: "{{ '/assets/display-preferences/contrast.json' | relative_url }}"
            }
          },
          "fluid.prefs.speak": {
            enactor: {
              orator: {
                controller: {
                  strings: { play: "Read this page aloud", pause: "Pause reading" }
                }
              }
            }
          }
        },
        prefsEditorLoader: {
          lazyLoad: true,
          slidingPanel: {
            strings: {
              showText: "+ Show preferences",
              hideText: "− Hide preferences",
              showTextAriaLabel: "Show preferences",
              hideTextAriaLabel: "Hide preferences",
              panelLabel: "Display preferences"
            }
          }
        }
      });
    }

    /* infusion-uio.js loads at the end of the page (footer/custom.html), so wait until the page is parsed */
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  })();
</script>
