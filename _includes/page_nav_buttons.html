<!--
  Page navigation helpers. Included from footer/custom.html.
  Styles are in _sass/portfolio/_custom.scss (search for "Floating" and
  "On this page: collapsible").

  1. "Back to top" button. It appears once you scroll.
     - Wide screens (1024px and up), page with an "On this page" box: it sits
       in the right-hand column, just below the box, and stays there as the
       box sticks to the top of the screen.
     - Wide screens, page without an "On this page" box: it floats at the
       bottom of the screen, lined up with the right-hand column.
     - Narrow screens, and pages without that column (like the home page):
       it floats in the bottom-right corner.
     - Without JavaScript, it stays as a plain link at the end of the page.

  2. Collapsible "On this page" box on narrow screens.
     - Below 1024px (Minimal Mistakes' "large" breakpoint) the theme moves the
       box to the top of the page, above the content. There, its title becomes
       a button that shows or hides the list, and it starts collapsed.
     - On wide screens the box sits on the right as usual, always open.
     - Without JavaScript, the list is simply always shown.
-->
<div class="page-nav" id="page-nav">
  <a class="page-nav-button" href="#top">Back to top</a>
</div>

<script>
  /* 1. "Back to top" */
  (function () {
    var bar = document.getElementById('page-nav');
    if (!bar) return;

    document.documentElement.classList.add('page-nav-floating');

    var home = bar.parentNode;              /* where it starts: the footer */
    var homeNext = bar.nextSibling;
    var page = document.querySelector('.layout--single .page');
    var sidebar = document.querySelector('.sidebar__right');

    /* Wide screens: Minimal Mistakes' "large" breakpoint, where the
       right-hand column appears */
    var wide = window.matchMedia('(min-width: 1024px)');

    /* On short screens (or at high zoom) the button doesn't float: it stays at
       the end of the page and is always shown. Must match the media query in _custom.scss. */
    var floats = window.matchMedia('(min-height: 30rem)');

    function tocShown() {
      return sidebar && getComputedStyle(sidebar).display !== 'none';
    }

    function place() {
      bar.classList.remove('page-nav--sidebar', 'page-nav--column');
      bar.style.left = '';

      if (wide.matches && floats.matches && tocShown()) {
        /* Below the "On this page" box */
        if (bar.parentNode !== sidebar) sidebar.appendChild(bar);
        bar.classList.add('page-nav--sidebar');
        return;
      }

      /* Everywhere else it floats, so it lives back in the footer */
      if (bar.parentNode !== home) home.insertBefore(bar, homeNext);

      if (wide.matches && page) {
        /* Line it up with the right-hand column: the page reserves that
           column as padding on its right-hand side */
        var rect = page.getBoundingClientRect();
        var column = parseFloat(getComputedStyle(page).paddingRight) || 0;
        var gap = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
        if (column > 0) {
          bar.style.left = (rect.right - column + gap) + 'px';
          bar.classList.add('page-nav--column');
        }
      }
    }

    function update() {
      var show = !floats.matches || window.scrollY > 0;
      bar.classList.toggle('is-visible', show);
      /* A hidden button shouldn't be reachable with Tab or by screen readers */
      if (show) bar.removeAttribute('inert'); else bar.setAttribute('inert', '');
    }

    function both() { place(); update(); }

    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', both);
    if (floats.addEventListener) floats.addEventListener('change', both);
    if (wide.addEventListener) wide.addEventListener('change', both);
    both();
  })();

  /* 2. Collapsible "On this page" on narrow screens */
  (function () {
    var toc = document.querySelector('.sidebar__right .toc');
    if (!toc) return;
    var title = toc.querySelector('.nav__title');
    var menu = toc.querySelector('.toc__menu');
    if (!title || !menu) return;

    menu.id = menu.id || 'toc-menu';
    var label = title.innerHTML;           /* the icon and "On this page" */

    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'toc__toggle';
    button.setAttribute('aria-controls', menu.id);
    button.innerHTML = label;

    var narrow = window.matchMedia('(max-width: 1023.98px)');
    var open = false;                      /* starts collapsed on narrow screens */

    function apply() {
      if (narrow.matches) {
        /* Heading keeps its level; the button goes inside it */
        if (button.parentNode !== title) {
          title.innerHTML = '';
          title.appendChild(button);
        }
        button.setAttribute('aria-expanded', open ? 'true' : 'false');
        menu.hidden = !open;
        toc.classList.toggle('toc--collapsed', !open);
      } else {
        /* Wide screens: plain heading, list always shown */
        if (button.parentNode === title) title.innerHTML = label;
        menu.hidden = false;
        toc.classList.remove('toc--collapsed');
      }
    }

    button.addEventListener('click', function () {
      open = !open;
      apply();
    });

    /* Choosing a link on a narrow screen closes the list again */
    menu.addEventListener('click', function (e) {
      if (narrow.matches && e.target.closest('a')) {
        open = false;
        apply();
      }
    });

    if (narrow.addEventListener) narrow.addEventListener('change', apply);
    apply();
  })();
</script>
