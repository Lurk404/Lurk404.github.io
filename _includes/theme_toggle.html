<!--
  Light/dark toggle, at the top of the display preferences panel, next to "Reset".
  Included from masthead.html. If the panel can't load, the script in
  display_preferences.html moves it into the header instead. The early part of the script (which loads both stylesheets and re-applies a
  saved choice before the page is drawn) is in head/custom.html.

  - Light is the default. Dark is the reader's choice, remembered in their
    browser (localStorage) so it carries over from page to page.
  - The visible label names the mode the button switches to ("Dark" or "Light").
    Screen readers hear "Switch to dark mode" / "Switch to light mode", which still
    contains the visible word, so voice control ("click Dark") works too.
  - The button stays hidden if JavaScript is off, since it can't work without it.
-->
<button type="button" class="page-nav-button js-toggle-dark-mode" hidden>Dark</button>

<script>
  (function () {
    var button = document.querySelector('.js-toggle-dark-mode');
    var light = document.getElementById('theme-light');
    var dark = document.getElementById('theme-dark');
    if (!button || !light || !dark) return;

    function isDark() {
      return document.documentElement.getAttribute('data-theme') === 'dark';
    }

    function updateLabel() {
      var next = isDark() ? 'Light' : 'Dark';
      button.textContent = next;
      button.setAttribute('aria-label', 'Switch to ' + next.toLowerCase() + ' mode');
    }

    button.addEventListener('click', function () {
      var goDark = !isDark();
      dark.media = goDark ? 'all' : 'not all';
      light.media = goDark ? 'not all' : 'all';
      document.documentElement.setAttribute('data-theme', goDark ? 'dark' : 'light');
      try {
        if (goDark) localStorage.setItem('theme', 'dark');
        else localStorage.removeItem('theme');
      } catch (e) {}
      updateLabel();
    });

    updateLabel();
    button.hidden = false;
  })();
</script>
